<!DOCTYPE html>
<html>
<head>
    <title>RLE Image Compression</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="p-4 bg-light">
<div class="container">
    <h2 class="mb-4">Web App Kompresi RLE (Gambar Grayscale)</h2>
    <div class="card p-4">
        <form action="/compress" method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Pilih Gambar (PNG/JPG)</label>
                <input type="file" name="image" class="form-control" accept="image/*" required />
            </div>
            <button type="submit" class="btn btn-primary"> Kompres & Preview </button>
        </form>
    </div>
    <p class="text-muted mt-3">
        Upload gambar untuk melihat hasil kompresi RLE, preview dekompresi,
        statistik, dan RLE full.
    </p>
</div>
</body>
</html>
